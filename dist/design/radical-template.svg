<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="220" height="150" viewBox="-10 -110 220 150">
  <title>根号の編集用テンプレート — 1em = 100 units</title>
  <desc>黒い根号と上線は独立したパスです。Inkscapeのノードツールで編集し、このSVGのまま保存してください。文字やフォントは含みません。根号の上線との接続点は (54,-82)。</desc>
  <g id="radical" inkscape:groupmode="layer" inkscape:label="根号（編集対象）" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path id="radical-hook" d="M3 -8 L18 -20 L36 0 L54 -82"/>
    <path id="radical-overbar" d="M54 -82 H190"/>
  </g>
  <g id="guides" inkscape:groupmode="layer" inkscape:label="ガイド（初期状態は非表示）" style="display:none" fill="none" stroke="#32a0dc" stroke-width="0.5" stroke-dasharray="2 2">
    <path d="M-10 0 H210 M-10 -82 H210 M54 -110 V40 M58 -110 V40"/>
  </g>
</svg>
